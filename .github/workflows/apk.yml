name: Android-APK bauen

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Disziplinator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: disziplinator-apk
          path: Disziplinator.apk
      # Jede Version als Release, damit die APK am Handy direkt herunterladbar ist:
      # github.com/<owner>/<repo>/releases/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Disziplinator Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Disziplinator.apk
          body: |
            Automatisch gebaut aus `${{ github.ref_name }}` (${{ github.sha }}).
            Auf dem Android-Handy: Disziplinator.apk antippen, herunterladen, öffnen, installieren.
